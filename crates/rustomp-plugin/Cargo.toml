[package]
name = "rustomp-plugin"
description = "rustomp 效果器插件的 nih-plug 外壳（M0 骨架）"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "rustomp_plugin"
crate-type = ["cdylib", "lib"]

[dependencies]
# nih-plug 不在 crates.io，必须用 git 依赖并固定 rev
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de42101" }
rustomp-dsp.workspace = true

[features]
default = []
# 调试用：音频线程里一旦发生堆分配就 panic（会大幅变慢）
assert_process_allocs = ["nih_plug/assert_process_allocs"]
