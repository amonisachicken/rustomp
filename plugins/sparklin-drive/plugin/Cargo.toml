# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "sparklin-drive"
description = "Sparklin Drive —— rustomp 框架的示例插件（HONEYPIE EFFECTS）"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "sparklin_drive"
crate-type = ["cdylib", "lib"]

[dependencies]
# 框架（与具体电路无关）
rustomp-dsp = { workspace = true }
# 本插件的电路
sparklin-drive-circuit = { path = "../circuit" }

# nih-plug 不在 crates.io，用 git 依赖并固定 rev
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de42101" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de42101" }
# 只用来解内嵌的面板 PNG
png = "0.17"

[features]
default = []
# 声道变体（Waves 式：单声道 / 立体声各出一个独立插件）
mono = []
stereo = []
# 调试：音频线程里一旦分配内存就 panic
assert_process_allocs = ["nih_plug/assert_process_allocs"]
