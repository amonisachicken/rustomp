# Sparklin Drive —— 插件项目描述
#
# 框架只读这个文件，**不含任何插件专属信息**（无状态）。
# 身份、素材路径、界面控件坐标都集中在这里。
# 以后换插件 = 新建一个同构的目录 + 一份 rustomp.toml。

[plugin]
# cargo 包名（bundler.toml 的键）
package = "sparklin-drive"
name = "Sparklin Drive"
vendor = "HONEYPIE EFFECTS"
url = "https://github.com/amonisachicken/rustomp"
email = ""
# CLAP id 会按变体追加后缀（.mono / .stereo）
clap_id = "com.honeypieeffects.sparklindrive"
# VST3 class id：必须恰好 16 字节，发布后不可改（每个变体各不相同）
vst3_class_id = "SparklinDriveV01"
vst3_class_id_mono = "SparklinDriveM01"
vst3_class_id_stereo = "SparklinDriveS01"

[au]
# AU 四字符码：发布后不可改
manufacturer_code = "HpEf"
manufacturer_name = "HONEYPIE EFFECTS"
bundle_id = "com.honeypieeffects.sparklindrive"
subtype_dual = "SPd1"
subtype_mono = "SPm1"
subtype_stereo = "SPs1"

[build]
# 发布时构建的变体（Waves 式：单声道 / 立体声各自独立身份）
variants = ["mono", "stereo"]
# 是否额外构建「同时支持两种布局」的调试版（不推荐发布）
dual_variant = false

[assets]
panel = "assets/panel@2x.png"
switch_up = "assets/switch_up@4x.png"
switch_down = "assets/switch_down@4x.png"

[ui]
# 所有坐标都是素材 SVG 的 viewBox 坐标
svg_width = 170.08
svg_height = 317.48
window_width = 340
window_height = 635
background = "#faf1e0"

[[ui.knobs]]
id = "level"
param = "level"
center = [43.41, 71.59]
radius = 27.86
pointer_len = 24.59
pointer_width = 0.98
# 指针角度范围（度），0.5 对应正上方
angle_min = -135.0
angle_max = 135.0
drag_full_range_px = 260.0

[[ui.knobs]]
id = "gain"
param = "gain"
center = [126.51, 70.43]
radius = 27.86
pointer_len = 24.59
pointer_width = 0.98
angle_min = -135.0
angle_max = 135.0
drag_full_range_px = 260.0

[ui.led]
param = "clip_indicator"
center = [85.04, 33.83]
radius = 8.5
off_color = "#a00000"
on_color = "#ff0000"

# 拨杆开关：两态各用一张贴图，以「六边形水平两顶点连线」为对齐基线
[ui.toggle]
param = "symmetric"
image_up = "switch_up"
image_down = "switch_down"
x = 73.49
y_up = 108.455
y_down = 109.985
width = 23.68
height = 25.21
# 缩放反馈的旋转/缩放原点 = 六边形基线中点
pivot = [85.33, 121.825]
press_scale = 0.9

# 按钮（bypass）：外形不随状态变化，只有按住时缩小
[ui.button]
param = "bypass"
center = [85.33, 236.17]
radius = 22.0
press_scale = 0.9
