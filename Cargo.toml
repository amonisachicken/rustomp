[workspace]
resolver = "2"
members = ["crates/rustomp-plugin", "tools/netlist/nlgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["amonisachicken"]
repository = "https://github.com/amonisachicken/rustomp"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# 注意：**不要**设 panic = "abort"。插件里 panic → 宿主收到 abort = Logic 直接闪退；
# 保留 unwind 让错误可被约束在单个回调内（尽管 nih-plug 不一定会 catch，但至少不会波及进程）。
strip = "symbols"

# 调试时捕获音频线程中的堆分配（会显著变慢，只在需要时开启）
[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
