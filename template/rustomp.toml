# __NAME__ —— 插件项目描述（由 rustomp 模板生成，请逐项填写）
#
# 框架只读这个文件，**不含任何插件专属信息**。

[plugin]
# cargo 包名（决定 bundler.toml 的键），建议小写短横线
package = "__SLUG__"
name = "__NAME__"
vendor = "HONEYPIE EFFECTS"
url = "https://github.com/amonisachicken/rustomp"
email = ""
# CLAP id（会按变体追加 .mono / .stereo）
clap_id = "com.honeypieeffects.__SLUG_DOT__"
# VST3 class id：每套恰好 16 字节，发布后不可改
vst3_class_id = "__VST3_DUAL__"
vst3_class_id_mono = "__VST3_MONO__"
vst3_class_id_stereo = "__VST3_STEREO__"

[au]
# AU 四字符码：发布后不可改
manufacturer_code = "HpEf"
manufacturer_name = "HONEYPIE EFFECTS"
bundle_id = "com.honeypieeffects.__SLUG_DOT__"
subtype_dual = "__AU_DUAL__"
subtype_mono = "__AU_MONO__"
subtype_stereo = "__AU_STEREO__"

[build]
variants = ["mono", "stereo"]
dual_variant = false
# 这一阶段生成的是**无界面**插件。做界面时：设 gui = true，
# 并在 plugin/src/editor.rs 里实现 `make(params, activity)`（S1d）。
gui = false

[requires]
# 跨仓版本约束（契约 A）：packer 启动时校验 `packer`，rustomp-gen 校验 `framework`。
# 不匹配就明确报错，不产出“能编但行为不同”的插件。
framework = ">=0.1,<0.2"   # rustomp crates（插件 Cargo.toml 的 git tag 应对应）
packer    = ">=0.1"        # rustomp-mac-plugin / rustomp-win-plugin
# packer_tag = "v0.1.6"    # 插件的 build.sh 自动 clone 打包工具时钉的 tag（可选）
# designer = ">=0.1"       # 面板设计器产物格式版本（仅记录，可选）

[circuit]
# 电路 crate 里实现 rustomp_dsp::Circuit 的类型 / 参数类型
plugin_type = "Gain"
params_type = "Params"

[[params]]
id = "gain"
name = "Gain"
type = "float"
default = 1.0
range = [0.0, 2.0]
format = "plain"
circuit = "gain"

[assets]
panel = "assets/panel@2x.png"

[ui]
svg_width = 170.08
svg_height = 317.48
window_width = 340
window_height = 635
background = "#faf1e0"

[[ui.knobs]]
id = "gain"
param = "gain"
center = [85.0, 120.0]
radius = 40.0
pointer_len = 34.0
pointer_width = 1.2
angle_min = -135.0
angle_max = 135.0
drag_full_range_px = 260.0
